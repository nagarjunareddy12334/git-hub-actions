name: Basic CI

on:
  push:
  pull_request:

env:
  PROJECT_NAME: github-actions-fundamentals
  ENVIRONMENT: development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display environment variables
        run: |
          echo "Project: $PROJECT_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/Ref: $GITHUB_REF"

      - name: Run CI test
        run: |
          echo "GitHub Actions CI workflow is running"
          echo "CI workflow completed successfully"

      - name: Understand GitHub Secrets
        run: |
          echo "Secrets should be stored in GitHub Secrets."
          echo "Never hard-code passwords, tokens, or API keys."