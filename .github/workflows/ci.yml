name: CI
 
on:
 workflow_dispatch:

  
env:
   APP_VERSION: 1.0.0

    
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    env:
      APP_NAME: My-CI-Project
 
    steps:
      
 
      - name: Display environment information
        run: |
          echo "Application: $APP_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
    
      - name: Calling the variable at project level
        run: |
          echo "Appliaction version: $APP_VERSION"

      - name: calling the variable at step level
        env:
          STEP_MESSAGE: This is a step-level variable
        run: 'echo "Step message: $STEP_MESSAGE"'
      - name: calling the gobal variable 
        run: echo  "${{ vars.PERSON_NAME }}" 
      - name: calling the secret var
        run: echo  "${{ secrets.DEMO_TOKEN }}"

      - name: Run CI test
        run: |
          echo "Running CI tests..."
          echo "CI workflow completed successfully!"